# =============================================================================
# NE-ES — Alembic configuration
#
# The database URL is NOT defined here.  alembic/env.py resolves it at runtime
# from (in order):
#     1. $NE_EMIS_DATABASE_URL
#     2. $DATABASE_URL
#     3. app.core.config.settings.DATABASE_URL   (composed from DATABASE_URL or
#        the discrete POSTGRES_* variables, and reads the same .env as the app)
#
# PostgreSQL 16 example (psycopg2):
#     DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/ne_es_dev
#
# Note: if your password contains '%' it must be percent-encoded ('%40' for '@')
# in the environment variable; env.py escapes it again for ConfigParser.
# =============================================================================

[alembic]
# Path to migration environment and versions directory.
script_location = alembic
prepend_sys_path = .

# Migration file name template (date + slug).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Max length of slugified message.
truncate_slug_length = 40

# Output encoding used by revision files.
output_encoding = utf-8

# Intentionally blank: injected by alembic/env.py from app.core.config.settings.
sqlalchemy.url =

# Alembic version table (single head, shared by every deployment).
version_table = alembic_version


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
