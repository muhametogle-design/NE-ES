# =============================================================================
# NE-EMIS — Alembic configuration
# The database URL is NOT set here; alembic/env.py resolves it dynamically
# from $NE_EMIS_DATABASE_URL or app.core.config.settings (which reads .env).
# =============================================================================

[alembic]
# Path to migration environment and versions directory.
script_location = alembic
prepend_sys_path = .

# Migration file name template (date + slug).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Max length of slugified message.
truncate_slug_length = 40

# Output encoding used by revision files.
output_encoding = utf-8

# Intentionally blank: overridden at runtime in env.py.
sqlalchemy.url =


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
