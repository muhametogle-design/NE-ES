# Alembic configuration for NE-EMIS.
#
# The database URL is NOT stored here. `migrations/env.py` resolves it at
# runtime from (in order):
#   1. the DATABASE_URL environment variable (CI, containers, production)
#   2. app.core.config.settings.DATABASE_URL (local .env / dev default)
# Keeping credentials out of version control is intentional.

[alembic]
script_location = migrations
prepend_sys_path = .
# Path to the application's SQLAlchemy metadata source of truth.
# Used by `alembic revision --autogenerate` for schema diffing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
